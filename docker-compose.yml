# Local development database. Start with `docker compose up -d`.
# The credentials match the default --database-url of `veyloom serve`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: veyloom
      POSTGRES_PASSWORD: veyloom
      POSTGRES_DB: veyloom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts, not data: they create the test database on a fresh
      # volume; `make db-test` does the same for an existing one. The data
      # itself lives in the pgdata volume, never in the repository.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyloom -d veyloom"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
